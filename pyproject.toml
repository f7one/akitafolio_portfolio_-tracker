[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akitafolio"
version = "2.0.0"
description = "Telegram bot for multi-chain crypto portfolio tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.9.1",
    "click==8.1.7",
    "hdwallet==2.2.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-telegram-bot==20.7",
    "requests==2.31.0",
    "rich==13.7.1",
    "web3==6.15.1",
]

[dependency-groups]
dev = [
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["akitafolio*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:pytest_ethereum"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["akitafolio", "cli"]

[tool.coverage.report]
fail_under = 20
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["akitafolio/models.py", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.uv]
package = true
